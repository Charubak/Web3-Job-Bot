name: One-time bounded Telegram pairing listener
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pair-listener.yml']
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  pair:
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify owner handshake and reply only to the original private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EXPECTED_BOT: charubak_web3jobs_bot
          PAIRING_SHA256: f2e05fdea1d105b17b319b9d226ab253e66cef01a6736c06823807fbd1d007bf
          PAIRING_ISSUED: '2026-10-19T15:05:00Z'
          PAIRING_EXPIRES: '2026-10-19T16:05:00Z'
        run: python -u pair_telegram.py --listen-once
