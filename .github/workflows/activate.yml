name: Activate verified private-chat job alerts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' || github.run_number == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore existing delivery history (never initialize here)
        id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-activation-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-alert-state-v1-
      - name: Validate expected bot and private recipient; prepare activation fence
        id: prepare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_BOT: charubak_web3jobs_bot
        run: python activation.py prepare >> "$GITHUB_OUTPUT"
      - name: Persist activation fence before the confirmation message
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-activation-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Verify durable activation fence exists
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-activation-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          lookup-only: true
          fail-on-cache-miss: true
      - name: Send one private-chat activation confirmation
        if: steps.prepare.outputs.prepared == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_BOT: charubak_web3jobs_bot
        run: python activation.py deliver
      - name: Save activation acknowledgment or unresolved delivery fence
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.prepared == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-activation-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Verify final activation state was persisted
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.prepared == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-activation-${{ github.run_id }}-${{ github.run_attempt }}-final
          lookup-only: true
          fail-on-cache-miss: true
