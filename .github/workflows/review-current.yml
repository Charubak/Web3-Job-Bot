name: Review current job matches (no messages)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-current.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' || github.run_number == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore existing history without resetting activation or delivery state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-review-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-alert-state-v1-
      - name: Refresh public posting history and produce a no-message review
        run: |
          test -f data/seen_jobs.db
          python scraper.py --refresh-history --report data/run_report.json
      - name: Persist expiry history while preserving delivery and activation records
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-review-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Verify persisted history exists
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-review-${{ github.run_id }}-${{ github.run_attempt }}-final
          lookup-only: true
          fail-on-cache-miss: true
      - name: Show public match and review evidence only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/run_report.json').read_text())
          print('PUBLIC_REVIEW_START')
          print(json.dumps({key: report[key] for key in ('counts', 'qualified', 'review')}, ensure_ascii=False))
          print('PUBLIC_REVIEW_END')
          PY
