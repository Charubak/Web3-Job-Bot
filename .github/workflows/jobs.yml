name: Scheduled job search
on:
  schedule:
    - cron: '30 7-12 * * *' # 13:00 IST target + hourly recovery; GitHub cron may be late
  workflow_run:
    workflows: ['Activate verified private-chat job alerts']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first. Initialize baselines existing matches without sending; send delivers one daily status plus new matches; test sends one labeled status only.'
        type: choice
        required: true
        default: preview
        options: [preview, initialize, send, test]
      test_id:
        description: 'Only for an explicitly requested additional test; reuse the same ID for any reconciliation.'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  search:
    # Alerts require a verified activation receipt; explicit false disables scheduled checks.
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_dispatch' || vars.JOB_ALERTS_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore acknowledged delivery state
        id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-alert-state-v1-
      - name: Preview (no Telegram, no state changes)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python scraper.py --dry-run --report data/run_report.json
      - name: Initialize a baseline (no Telegram)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize'
        run: python scraper.py --initialize-state --report data/run_report.json
      - name: Prepare daily status and selected jobs for the verified destination
        id: digest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.mode == 'send' || inputs.mode == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_MODE: ${{ inputs.mode }}
          TEST_ID: ${{ inputs.test_id }}
        run: |
          if [ "$DIGEST_MODE" = test ]; then
            python daily_digest.py prepare --test --test-id "$TEST_ID"
          else
            python daily_digest.py prepare
          fi
      - name: Persist fence before any Telegram request
        if: steps.digest.outputs.prepared == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Verify durable fence exists (cache-save warnings are insufficient)
        if: steps.digest.outputs.prepared == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          lookup-only: true
          fail-on-cache-miss: true
      - name: Deliver daily status and newly qualified jobs
        if: steps.digest.outputs.prepared == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_digest.py deliver
      - name: Save acknowledged deliveries, including before a later send failure
        if: >-
          always() && steps.state.outcome == 'success' &&
          (inputs.mode == 'initialize' || steps.digest.outcome == 'success' || steps.digest.outcome == 'failure') &&
          hashFiles('data/seen_jobs.db') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Verify final delivery state persisted
        if: always() && steps.digest.outputs.prepared == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-final
          lookup-only: true
          fail-on-cache-miss: true
      - name: Summarize assessments
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/run_report.json')
          if p.exists():
              data = json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Job assessment\n')
                  for key, value in data['counts'].items():
                      f.write(f'- {key}: {value}\n')
                  for source in data.get('sources', []):
                      f.write(f"- Source {source['source']}: {source['status']}, {source['count']} listings\n")
                  f.write('\nReview listings were not alerted. See the run log for reasons.\n')
          PY
