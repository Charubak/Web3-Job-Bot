name: Scheduled job search
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first. Initialize baselines existing matches without sending; send delivers new matches.'
        type: choice
        required: true
        default: preview
        options: [preview, initialize, send]
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  search:
    # Disabled by default; no paid runner/private-repo fallback and no fork alerts.
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.JOB_ALERTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore acknowledged delivery state
        id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-alert-state-v1-
      - name: Preview (no Telegram, no state changes)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python scraper.py --dry-run --report data/run_report.json
      - name: Initialize a baseline (no Telegram)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize'
        run: python scraper.py --initialize-state --report data/run_report.json
      - name: Validate delivery configuration before preparing
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from config import validate_telegram_config; validate_telegram_config()"
      - name: Prepare and fence selected jobs (no Telegram)
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: python scraper.py --prepare-send data/pending_plan.json --max-alerts 10 --report data/run_report.json
      - name: Persist fence before any Telegram request
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Verify durable fence exists (cache-save warnings are insufficient)
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          lookup-only: true
          fail-on-cache-miss: true
      - name: Deliver newly qualified jobs
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py --deliver-prepared data/pending_plan.json
      - name: Save acknowledged deliveries, including before a later send failure
        if: >-
          always() && steps.state.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.mode != 'preview') &&
          hashFiles('data/seen_jobs.db') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Summarize assessments
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/run_report.json')
          if p.exists():
              data = json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Job assessment\n')
                  for key, value in data['counts'].items():
                      f.write(f'- {key}: {value}\n')
                  f.write('\nReview listings were not alerted. See the run log for reasons.\n')
          PY
