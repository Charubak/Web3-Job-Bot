name: Public job research collection
on:
  schedule:
    - cron: '0,15 7 * * *' #12:30/12:45 Asia/Kolkata, before13:00 research digest
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-job-research-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'Charubak/Web3-Job-Bot' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: ${{ github.workspace }}/data
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Read legacy public posting dates without delivery credentials
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-research-${{ github.run_id }}
          restore-keys: job-alert-state-v1-
      - name: Restore durable collection history from data branch
        run: |
          mkdir -p data
          git ls-remote --heads origin research-data > data/data-ref.txt
          if [ -s data/data-ref.txt ]; then
            git fetch --depth=1 origin research-data
            git show FETCH_HEAD:history.json > data/research-history.json
          fi
      - name: Collect without Telegram configuration or delivery-state changes
        run: python research_collector.py --output public-export --history data/research-history.json --legacy-history data/seen_jobs.db
      - name: Archive allowlisted public evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-job-research
          path: |
            public-export/latest.json
            public-export/latest.md
            public-export/history.json
            public-export/candidates/*.json
            public-export/rejections/*.json
            public-export/research-queue/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage and research backlog
        run: cat public-export/latest.md >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Ephemeral permission for this job only. No PAT, bot token, account grant,
    # default-permission change, credential creation or paid service.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-job-research
          path: ${{ runner.temp }}/public-job-research
      - name: Publish only public job evidence on isolated data branch
        env:
          EXPORT_DIR: ${{ runner.temp }}/public-job-research
        run: |
          git ls-remote --heads origin research-data > "$RUNNER_TEMP/data-ref.txt"
          if [ -s "$RUNNER_TEMP/data-ref.txt" ]; then
            git fetch --depth=1 origin research-data
            git checkout -B research-data FETCH_HEAD
          else
            git switch --orphan research-data
          fi
          cp "$EXPORT_DIR/latest.json" latest.json
          cp "$EXPORT_DIR/latest.md" latest.md
          cp "$EXPORT_DIR/history.json" history.json
          mkdir -p candidates rejections research-queue
          rm -f candidates/part-*.json rejections/part-*.json research-queue/part-*.json
          cp "$EXPORT_DIR"/candidates/part-*.json candidates/
          cp "$EXPORT_DIR"/rejections/part-*.json rejections/
          cp "$EXPORT_DIR"/research-queue/part-*.json research-queue/
          git add -- latest.json latest.md history.json candidates rejections research-queue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public job research evidence'
            git push origin HEAD:research-data
          fi
