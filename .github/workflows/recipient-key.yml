name: Prepare encrypted recipient configuration
on:
  push:
    branches: [dot/activate-verified-delivery]
    paths: ['.github/workflows/recipient-key.yml']
permissions:
  contents: read
jobs:
  key:
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/dot/activate-verified-delivery' &&
      github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Emit only the purpose-specific public encryption key
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python recipient_envelope.py --public-key
