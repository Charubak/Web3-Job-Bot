name: Deployment readiness (no messages)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/setup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-job-search
  cancel-in-progress: false
jobs:
  readiness:
    if: >-
      github.repository == 'Charubak/Web3-Job-Bot' &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check existing configuration presence (booleans only)
        env:
          HAS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' }}
          ALERTS_ENABLED: ${{ vars.JOB_ALERTS_ENABLED == 'true' }}
        run: |
          python - <<'PY'
          import os
          lines = ['### Deployment readiness (no Telegram messages)']
          for label, key in [('Bot token configured', 'HAS_BOT_TOKEN'), ('Chat ID configured', 'HAS_CHAT_ID'), ('Scheduled delivery enabled', 'ALERTS_ENABLED')]:
              lines.append(f'- {label}: {os.environ[key]}')
          lines.append('- Presence alone does not verify the Telegram recipient or token validity.')
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY
      - name: Confirm public cache inventory (errors stop initialization)
        id: inventory
        run: python deployment_readiness.py
      - name: Restore exact newest delivery history
        if: steps.inventory.outputs.exists == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: ${{ steps.inventory.outputs.key }}
          fail-on-cache-miss: true
      - name: Preview or initialize missing baseline (no Telegram)
        id: baseline
        env:
          PRIOR_STATE_EXISTS: ${{ steps.inventory.outputs.exists }}
        run: |
          if test "$PRIOR_STATE_EXISTS" = true; then
            test -f data/seen_jobs.db || { echo "Existing history was not restored; refusing initialization"; exit 1; }
            python scraper.py --dry-run --report data/run_report.json
          else
            python scraper.py --initialize-state --report data/run_report.json
            echo 'initialized=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Persist newly initialized baseline
        if: steps.baseline.outputs.initialized == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-setup-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Verify newly initialized baseline exists
        if: steps.baseline.outputs.initialized == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seen_jobs.db
          key: job-alert-state-v1-setup-${{ github.run_id }}-${{ github.run_attempt }}-final
          lookup-only: true
          fail-on-cache-miss: true
      - name: Summarize listing checks
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/run_report.json')
          if p.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('\n### Listing checks\n')
                  for key, value in json.loads(p.read_text())['counts'].items():
                      f.write(f'- {key}: {value}\n')
                  f.write('\nNo Telegram Bot API requests or messages were made by this workflow.\n')
          PY
